<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magic Patterns Kids Coloring Book</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts: Fredoka & Nunito for kid-friendly playful UI -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          boxShadow: {
            'bouncy': '0 8px 0 0 rgba(0,0,0,0.15)',
            'bouncy-sm': '0 4px 0 0 rgba(0,0,0,0.15)',
            'bouncy-active': '0 2px 0 0 rgba(0,0,0,0.15)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    }

    /* Custom Scrollbar for Pattern & Color Trays */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Pop Animation for Interactive Elements */
    .btn-pop {
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease;
    }
    .btn-pop:hover {
      transform: translateY(-3px) scale(1.03);
    }
    .btn-pop:active {
      transform: translateY(2px) scale(0.97);
    }

    /* Active tool selection ring */
    .tool-selected {
      outline: 5px solid #FF5E7E;
      outline-offset: 3px;
      transform: scale(1.08);
    }

    /* Pattern Canvas Frame Outer Glow */
    .canvas-container {
      box-shadow: 0 15px 35px rgba(50, 50, 93, 0.15), 0 5px 15px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header / Top Bar -->
  <header class="w-full bg-white/90 backdrop-blur-md px-4 py-3 border-b-4 border-yellow-300 flex items-center justify-between z-20 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-12 h-12 bg-pink-400 rounded-2xl flex items-center justify-center text-white text-2xl shadow-bouncy-sm transform -rotate-6">
        <i class="fa-solid font-bold fa-palette"></i>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-pink-500 tracking-wider">Magic Magic Color!</h1>
        <p class="text-xs text-purple-600 font-nunito hidden sm:block">Tap areas to fill with colors & custom patterns!</p>
      </div>
    </div>

    <!-- Action Buttons (Clear, Undo, Confetti/Finish) -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <button id="undo-btn" title="Undo" class="btn-pop bg-yellow-400 hover:bg-yellow-300 text-yellow-900 w-11 h-11 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center text-lg sm:text-xl font-bold border-2 border-yellow-500 shadow-bouncy-sm">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="clear-btn" title="Clear Page" class="btn-pop bg-red-400 hover:bg-red-300 text-white w-11 h-11 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center text-lg sm:text-xl font-bold border-2 border-red-500 shadow-bouncy-sm">
        <i class="fa-solid fa-trash-can"></i>
      </button>
      <button id="finish-btn" class="btn-pop bg-green-400 hover:bg-green-300 text-green-950 px-4 py-2 sm:px-5 sm:py-3 rounded-2xl flex items-center space-x-2 text-base sm:text-lg font-bold border-2 border-green-500 shadow-bouncy-sm">
        <i class="fa-solid fa-sparkles text-yellow-200"></i>
        <span>Done!</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 flex flex-col lg:flex-row items-center justify-center gap-4">
    
    <!-- Template Selector Sidebar (Left on Desktop, Top Carousel on Mobile) -->
    <section class="w-full lg:w-48 bg-white/80 backdrop-blur rounded-3xl p-3 border-4 border-purple-200 shadow-md flex lg:flex-col items-center justify-around gap-2 overflow-x-auto no-scrollbar">
      <span class="text-purple-700 font-bold text-sm hidden lg:block text-center uppercase tracking-wide">Choose Picture</span>
      
      <div id="templates-list" class="flex lg:flex-col gap-3 w-full min-w-max lg:min-w-0 justify-center">
        <!-- Template thumbnails injected by JS -->
      </div>
    </section>

    <!-- Canvas Workspace Area -->
    <section class="flex-1 flex flex-col items-center justify-center w-full max-w-2xl relative">
      <div class="canvas-container relative w-full aspect-square max-h-[60vh] lg:max-h-[68vh] bg-white rounded-3xl p-2 border-8 border-white overflow-hidden flex items-center justify-center">
        <!-- Interactive Canvas -->
        <canvas id="coloring-canvas" class="w-full h-full cursor-pointer touch-none rounded-2xl"></canvas>
        
        <!-- Loading Overlay for pattern processing -->
        <div id="loader" class="absolute inset-0 bg-white/75 backdrop-blur-sm flex flex-col items-center justify-center hidden z-30">
          <div class="w-16 h-16 border-8 border-pink-400 border-t-transparent rounded-full animate-spin"></div>
          <p class="mt-3 text-pink-600 font-bold text-lg">Magic at work...</p>
        </div>
      </div>
    </section>

    <!-- Right Control Panel: Mode Selector -->
    <section class="w-full lg:w-56 bg-white/80 backdrop-blur rounded-3xl p-3 border-4 border-pink-200 shadow-md flex flex-row lg:flex-col justify-between items-center gap-3">
      <span class="text-pink-600 font-bold text-sm hidden lg:block text-center uppercase tracking-wide">Coloring Mode</span>
      
      <div class="grid grid-cols-3 lg:grid-cols-1 gap-2.5 w-full">
        <!-- Mode 1: Solid Colors -->
        <button id="mode-solid" class="btn-pop active-mode-btn bg-purple-500 text-white p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-purple-600 shadow-bouncy-sm">
          <i class="fa-solid fa-fill-drip text-xl"></i>
          <span class="hidden sm:inline font-bold text-sm lg:text-base">Solid Colors</span>
        </button>

        <!-- Mode 2: Patterns -->
        <button id="mode-pattern" class="btn-pop bg-pink-100 text-pink-700 hover:bg-pink-200 p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-pink-300 shadow-bouncy-sm">
          <i class="fa-solid fa-shapes text-xl text-pink-500"></i>
          <span class="hidden sm:inline font-bold text-sm lg:text-base">Patterns</span>
        </button>

        <!-- Mode 3: Eraser (Fill White) -->
        <button id="mode-eraser" class="btn-pop bg-blue-100 text-blue-700 hover:bg-blue-200 p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-blue-300 shadow-bouncy-sm">
          <i class="fa-solid fa-eraser text-xl text-blue-500"></i>
          <span class="hidden sm:inline font-bold text-sm lg:text-base">Eraser</span>
        </button>
      </div>

      <!-- Quick Tips Box for Kids -->
      <div class="hidden lg:flex bg-yellow-100 border-2 border-yellow-300 rounded-2xl p-3 text-xs text-yellow-800 flex-col items-center text-center gap-1">
        <i class="fa-solid fa-lightbulb text-yellow-500 text-lg mb-1"></i>
        <span><strong>Pro Tip:</strong> Tap inside any white shape to splash patterns or colors!</span>
      </div>
    </section>

  </main>

  <!-- Bottom Toolbar: Palette & Custom Pattern Swatches Tray -->
  <footer class="w-full bg-white/95 backdrop-blur-lg border-t-4 border-pink-300 p-3 z-20 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col gap-2">
      
      <!-- Tray Title & Custom Upload Prompt -->
      <div class="flex items-center justify-between px-2">
        <div class="flex items-center space-x-2">
          <span id="tray-title" class="text-base sm:text-lg font-bold text-purple-700">Select a Solid Color:</span>
          <span id="active-tool-indicator" class="px-3 py-0.5 rounded-full text-xs font-bold bg-pink-200 text-pink-800">Solid Color</span>
        </div>

        <!-- Custom Image Pattern Uploader Button -->
        <label id="upload-pattern-label" class="btn-pop bg-gradient-to-r from-pink-500 to-purple-500 text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl text-xs sm:text-sm font-bold flex items-center space-x-2 cursor-pointer shadow-bouncy-sm border-2 border-pink-600">
          <i class="fa-solid fa-plus text-yellow-300 text-sm"></i>
          <span>Add Custom Pattern</span>
          <input type="file" id="custom-pattern-input" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- Scrollable Color/Pattern Swatches Bar -->
      <div id="swatches-container" class="flex items-center space-x-3 overflow-x-auto py-2 px-1 no-scrollbar min-h-[70px]">
        <!-- Swatches rendered via JS -->
      </div>
    </div>
  </footer>

  <!-- App Logic Javascript -->
  <script>
    // --- Web Audio Synthesizer for Kid-Friendly Tones ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'pop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'select') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.05); // E5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'fanfare') {
        const notes = [400, 500, 600, 800];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + idx * 0.08);
          g.gain.setValueAtTime(0.25, now + idx * 0.08);
          g.gain.linearRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
          o.start(now + idx * 0.08);
          o.stop(now + idx * 0.08 + 0.15);
        });
      }
    }

    // --- Line Art Canvas Templates (Procedural Vectors) ---
    const TEMPLATES = [
      {
        id: 'cat',
        name: 'Cute Kitty',
        icon: 'fa-cat',
        draw: (ctx, width, height) => {
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#1E1E24';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Head
          ctx.beginPath();
          ctx.ellipse(width*0.5, height*0.52, width*0.28, height*0.24, 0, 0, Math.PI*2);
          ctx.stroke();

          // Left Ear
          ctx.beginPath();
          ctx.moveTo(width*0.28, height*0.35);
          ctx.lineTo(width*0.22, height*0.14);
          ctx.lineTo(width*0.42, height*0.30);
          ctx.stroke();
          // Inner Left Ear
          ctx.beginPath();
          ctx.moveTo(width*0.30, height*0.33);
          ctx.lineTo(width*0.25, height*0.19);
          ctx.lineTo(width*0.39, height*0.30);
          ctx.stroke();

          // Right Ear
          ctx.beginPath();
          ctx.moveTo(width*0.72, height*0.35);
          ctx.lineTo(width*0.78, height*0.14);
          ctx.lineTo(width*0.58, height*0.30);
          ctx.stroke();
          // Inner Right Ear
          ctx.beginPath();
          ctx.moveTo(width*0.70, height*0.33);
          ctx.lineTo(width*0.75, height*0.19);
          ctx.lineTo(width*0.61, height*0.30);
          ctx.stroke();

          // Eyes
          ctx.beginPath();
          ctx.arc(width*0.38, height*0.48, width*0.045, 0, Math.PI*2);
          ctx.arc(width*0.62, height*0.48, width*0.045, 0, Math.PI*2);
          ctx.fillStyle = '#1E1E24';
          ctx.fill();

          // Nose
          ctx.beginPath();
          ctx.moveTo(width*0.47, height*0.56);
          ctx.lineTo(width*0.53, height*0.56);
          ctx.lineTo(width*0.5, height*0.60);
          ctx.closePath();
          ctx.fill();

          // Mouth
          ctx.beginPath();
          ctx.arc(width*0.45, height*0.61, width*0.05, 0, Math.PI*0.8);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(width*0.55, height*0.61, width*0.05, Math.PI*0.2, Math.PI);
          ctx.stroke();

          // Whiskers
          ctx.beginPath();
          ctx.moveTo(width*0.24, height*0.53); ctx.lineTo(width*0.08, height*0.50);
          ctx.moveTo(width*0.23, height*0.58); ctx.lineTo(width*0.07, height*0.60);
          ctx.moveTo(width*0.76, height*0.53); ctx.lineTo(width*0.92, height*0.50);
          ctx.moveTo(width*0.77, height*0.58); ctx.lineTo(width*0.93, height*0.60);
          ctx.stroke();

          // Bowtie/Ribbon
          ctx.beginPath();
          ctx.moveTo(width*0.5, height*0.75);
          ctx.lineTo(width*0.35, height*0.70);
          ctx.lineTo(width*0.35, height*0.82);
          ctx.closePath();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(width*0.5, height*0.75);
          ctx.lineTo(width*0.65, height*0.70);
          ctx.lineTo(width*0.65, height*0.82);
          ctx.closePath();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(width*0.5, height*0.76, width*0.04, 0, Math.PI*2);
          ctx.stroke();
        }
      },
      {
        id: 'rocket',
        name: 'Space Rocket',
        icon: 'fa-rocket',
        draw: (ctx, width, height) => {
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#1E1E24';
          ctx.lineCap = 'round';

          // Body
          ctx.beginPath();
          ctx.moveTo(width*0.5, height*0.1);
          ctx.bezierCurveTo(width*0.75, height*0.3, width*0.75, height*0.65, width*0.7, height*0.75);
          ctx.lineTo(width*0.3, height*0.75);
          ctx.bezierCurveTo(width*0.25, height*0.65, width*0.25, height*0.3, width*0.5, height*0.1);
          ctx.stroke();

          // Nose Cone Line
          ctx.beginPath();
          ctx.moveTo(width*0.32, height*0.32);
          ctx.quadraticCurveTo(width*0.5, height*0.36, width*0.68, height*0.32);
          ctx.stroke();

          // Window Outer & Inner
          ctx.beginPath();
          ctx.arc(width*0.5, height*0.5, width*0.12, 0, Math.PI*2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(width*0.5, height*0.5, width*0.08, 0, Math.PI*2);
          ctx.stroke();

          // Fins Left
          ctx.beginPath();
          ctx.moveTo(width*0.31, height*0.65);
          ctx.lineTo(width*0.12, height*0.82);
          ctx.lineTo(width*0.3, height*0.75);
          ctx.stroke();

          // Fins Right
          ctx.beginPath();
          ctx.moveTo(width*0.69, height*0.65);
          ctx.lineTo(width*0.88, height*0.82);
          ctx.lineTo(width*0.7, height*0.75);
          ctx.stroke();

          // Flame Base
          ctx.beginPath();
          ctx.moveTo(width*0.38, height*0.75);
          ctx.lineTo(width*0.5, height*0.93);
          ctx.lineTo(width*0.62, height*0.75);
          ctx.stroke();

          // Stars around
          const drawStar = (cx, cy, r) => {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r + cx,
                         -Math.sin((18 + i * 72) * Math.PI / 180) * r + cy);
              ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r/2) + cx,
                         -Math.sin((54 + i * 72) * Math.PI / 180) * (r/2) + cy);
            }
            ctx.closePath();
            ctx.stroke();
          };

          drawStar(width*0.18, height*0.25, width*0.05);
          drawStar(width*0.82, height*0.28, width*0.06);
          drawStar(width*0.84, height*0.62, width*0.04);
        }
      },
      {
        id: 'rainbow',
        name: 'Rainbow & Cloud',
        icon: 'fa-cloud-sun-rain',
        draw: (ctx, width, height) => {
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#1E1E24';
          ctx.lineCap = 'round';

          // Rainbow Arcs
          const radii = [0.38, 0.32, 0.26, 0.20];
          radii.forEach(r => {
            ctx.beginPath();
            ctx.arc(width*0.5, height*0.65, width*r, Math.PI, Math.PI*2);
            ctx.stroke();
          });

          // Sun in background
          ctx.beginPath();
          ctx.arc(width*0.2, height*0.25, width*0.09, 0, Math.PI*2);
          ctx.stroke();

          // Sun Rays
          for(let a=0; a<Math.PI*2; a+=Math.PI/4) {
            ctx.beginPath();
            ctx.moveTo(width*0.2 + Math.cos(a)*width*0.11, height*0.25 + Math.sin(a)*width*0.11);
            ctx.lineTo(width*0.2 + Math.cos(a)*width*0.15, height*0.25 + Math.sin(a)*width*0.15);
            ctx.stroke();
          }

          // Cloud Left
          ctx.beginPath();
          ctx.arc(width*0.22, height*0.65, width*0.08, Math.PI*0.5, Math.PI*1.5);
          ctx.arc(width*0.30, height*0.58, width*0.09, Math.PI, Math.PI*1.85);
          ctx.arc(width*0.38, height*0.64, width*0.07, Math.PI*1.2, Math.PI*0.2);
          ctx.arc(width*0.32, height*0.72, width*0.08, 0, Math.PI*0.8);
          ctx.closePath();
          ctx.stroke();

          // Cloud Right
          ctx.beginPath();
          ctx.arc(width*0.65, height*0.65, width*0.08, Math.PI*0.5, Math.PI*1.5);
          ctx.arc(width*0.73, height*0.56, width*0.1, Math.PI, Math.PI*1.85);
          ctx.arc(width*0.82, height*0.64, width*0.07, Math.PI*1.2, Math.PI*0.2);
          ctx.arc(width*0.75, height*0.72, width*0.08, 0, Math.PI*0.8);
          ctx.closePath();
          ctx.stroke();
        }
      },
      {
        id: 'apple',
        name: 'Sweet Fruit',
        icon: 'fa-apple-whole',
        draw: (ctx, width, height) => {
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#1E1E24';
          ctx.lineCap = 'round';

          // Apple Body
          ctx.beginPath();
          ctx.moveTo(width*0.5, height*0.32);
          ctx.bezierCurveTo(width*0.35, height*0.18, width*0.15, height*0.35, width*0.2, height*0.62);
          ctx.bezierCurveTo(width*0.23, height*0.85, width*0.45, height*0.90, width*0.5, height*0.84);
          ctx.bezierCurveTo(width*0.55, height*0.90, width*0.77, height*0.85, width*0.8, height*0.62);
          ctx.bezierCurveTo(width*0.85, height*0.35, width*0.65, height*0.18, width*0.5, height*0.32);
          ctx.stroke();

          // Stem
          ctx.beginPath();
          ctx.moveTo(width*0.5, height*0.32);
          ctx.quadraticCurveTo(width*0.52, height*0.2, width*0.56, height*0.12);
          ctx.stroke();

          // Leaf
          ctx.beginPath();
          ctx.moveTo(width*0.53, height*0.22);
          ctx.quadraticCurveTo(width*0.72, height*0.15, width*0.75, height*0.28);
          ctx.quadraticCurveTo(width*0.58, height*0.33, width*0.53, height*0.22);
          ctx.stroke();

          // Cute Smile on Apple
          ctx.beginPath();
          ctx.arc(width*0.38, height*0.5, width*0.035, 0, Math.PI*2);
          ctx.arc(width*0.62, height*0.5, width*0.035, 0, Math.PI*2);
          ctx.fillStyle = '#1E1E24';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(width*0.5, height*0.57, width*0.06, 0, Math.PI);
          ctx.stroke();
        }
      }
    ];

    // --- Color Palette Data ---
    const SOLID_COLORS = [
      { name: 'Red', hex: '#FF4757' },
      { name: 'Pink', hex: '#FF6B81' },
      { name: 'Orange', hex: '#FFA502' },
      { name: 'Yellow', hex: '#ECCC68' },
      { name: 'Lime', hex: '#7BED9F' },
      { name: 'Green', hex: '#2ED573' },
      { name: 'Cyan', hex: '#70A1FF' },
      { name: 'Blue', hex: '#1E90FF' },
      { name: 'Purple', hex: '#5352ED' },
      { name: 'Magenta', hex: '#9B59B6' },
      { name: 'Brown', hex: '#8D5524' },
      { name: 'Black', hex: '#2F3542' }
    ];

    // --- Pattern Generators (Built-in Procedural Pattern Textures) ---
    function generatePatternImage(type, color1 = '#FF6B81', color2 = '#FFFFFF') {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 64;
      pCanvas.height = 64;
      const pCtx = pCanvas.getContext('2d');

      pCtx.fillStyle = color2;
      pCtx.fillRect(0, 0, 64, 64);
      pCtx.fillStyle = color1;
      pCtx.strokeStyle = color1;
      pCtx.lineWidth = 4;

      if (type === 'polkadot') {
        pCtx.beginPath();
        pCtx.arc(16, 16, 8, 0, Math.PI * 2);
        pCtx.arc(48, 48, 8, 0, Math.PI * 2);
        pCtx.fill();
        pCtx.beginPath();
        pCtx.arc(48, 16, 4, 0, Math.PI * 2);
        pCtx.arc(16, 48, 4, 0, Math.PI * 2);
        pCtx.fill();
      } else if (type === 'stripes') {
        pCtx.lineWidth = 10;
        pCtx.beginPath();
        pCtx.moveTo(-16, 32); pCtx.lineTo(32, -16);
        pCtx.moveTo(0, 64); pCtx.lineTo(64, 0);
        pCtx.moveTo(32, 80); pCtx.lineTo(80, 32);
        pCtx.stroke();
      } else if (type === 'stars') {
        const drawStar = (cx, cy, r) => {
          pCtx.beginPath();
          for (let i = 0; i < 5; i++) {
            pCtx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r + cx,
                        -Math.sin((18 + i * 72) * Math.PI / 180) * r + cy);
            pCtx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r/2) + cx,
                        -Math.sin((54 + i * 72) * Math.PI / 180) * (r/2) + cy);
          }
          pCtx.closePath();
          pCtx.fill();
        };
        drawStar(20, 20, 10);
        drawStar(50, 50, 8);
      } else if (type === 'hearts') {
        const drawHeart = (x, y, scale) => {
          pCtx.save();
          pCtx.translate(x, y);
          pCtx.scale(scale, scale);
          pCtx.beginPath();
          pCtx.moveTo(0, 0);
          pCtx.bezierCurveTo(-5, -7, -12, 0, 0, 10);
          pCtx.bezierCurveTo(12, 0, 5, -7, 0, 0);
          pCtx.fill();
          pCtx.restore();
        };
        drawHeart(20, 22, 1.2);
        drawHeart(50, 52, 0.9);
      } else if (type === 'checker') {
        pCtx.fillRect(0, 0, 32, 32);
        pCtx.fillRect(32, 32, 32, 32);
      } else if (type === 'waves') {
        pCtx.lineWidth = 5;
        pCtx.beginPath();
        pCtx.arc(16, 20, 16, Math.PI, 0);
        pCtx.arc(48, 20, 16, 0, Math.PI);
        pCtx.stroke();
        pCtx.beginPath();
        pCtx.arc(16, 52, 16, Math.PI, 0);
        pCtx.arc(48, 52, 16, 0, Math.PI);
        pCtx.stroke();
      }

      return pCanvas.toDataURL();
    }

    // Built-in pattern list
    let PATTERNS = [
      { id: 'dots', name: 'Polka Dots', src: generatePatternImage('polkadot', '#FF4757', '#FFEAA7') },
      { id: 'stars', name: 'Magic Stars', src: generatePatternImage('stars', '#5352ED', '#74B9FF') },
      { id: 'stripes', name: 'Candy Stripes', src: generatePatternImage('stripes', '#FF6B81', '#FFFFFF') },
      { id: 'hearts', name: 'Sweet Hearts', src: generatePatternImage('hearts', '#FF4757', '#FFD8D8') },
      { id: 'checker', name: 'Checkerboard', src: generatePatternImage('checker', '#2ED573', '#E8FAE0') },
      { id: 'waves', name: 'Ocean Waves', src: generatePatternImage('waves', '#1E90FF', '#E0F2FE') }
    ];

    // --- State Management ---
    let currentTemplateIndex = 0;
    let currentMode = 'solid'; // 'solid', 'pattern', 'eraser'
    let selectedColor = SOLID_COLORS[0].hex;
    let selectedPatternImg = null; // HTMLImageElement
    let undoHistory = [];
    const MAX_UNDO = 10;

    // DOM Elements
    const canvas = document.getElementById('coloring-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const templatesListEl = document.getElementById('templates-list');
    const swatchesContainer = document.getElementById('swatches-container');
    const trayTitleEl = document.getElementById('tray-title');
    const activeToolIndicator = document.getElementById('active-tool-indicator');
    const modeSolidBtn = document.getElementById('mode-solid');
    const modePatternBtn = document.getElementById('mode-pattern');
    const modeEraserBtn = document.getElementById('mode-eraser');
    const customPatternInput = document.getElementById('custom-pattern-input');
    const uploadPatternLabel = document.getElementById('upload-pattern-label');
    const clearBtn = document.getElementById('clear-btn');
    const undoBtn = document.getElementById('undo-btn');
    const finishBtn = document.getElementById('finish-btn');
    const loader = document.getElementById('loader');

    // Load initial pattern image
    const preloadPattern = (src) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => resolve(img);
        img.src = src;
      });
    };

    // Initialize Canvas Dimensions & Render Template
    async function initCanvas() {
      // Set intrinsic resolution higher for sharp graphics on Retina displays
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      // Preload first pattern
      if (!selectedPatternImg && PATTERNS.length > 0) {
        selectedPatternImg = await preloadPattern(PATTERNS[0].src);
      }

      loadTemplate(currentTemplateIndex);
    }

    // Load template line art into Canvas
    function loadTemplate(index) {
      currentTemplateIndex = index;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fill background with solid white
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw vector template lines
      TEMPLATES[index].draw(ctx, canvas.width, canvas.height);

      // Save initial clean state to undo buffer
      saveState();
      updateTemplateUI();
    }

    // Undo State Buffer
    function saveState() {
      if (undoHistory.length >= MAX_UNDO) {
        undoHistory.shift();
      }
      undoHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undo() {
      if (undoHistory.length > 1) {
        undoHistory.pop(); // Remove current
        const prevState = undoHistory[undoHistory.length - 1];
        ctx.putImageData(prevState, 0, 0);
        playSound('pop');
      }
    }

    // --- Flood Fill Algorithm with Pattern & Color Support ---
    function floodFill(startX, startY, fillStyleTarget) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      // Get target color at start point
      const startPos = (startY * width + startX) * 4;
      const startR = data[startPos];
      const startG = data[startPos + 1];
      const startB = data[startPos + 2];
      const startA = data[startPos + 3];

      // Don't fill if clicking directly on black outlines
      if (startR < 50 && startG < 50 && startB < 50) return;

      // Create temporary offscreen canvas for pattern tiling rasterization
      let patternCanvas, patternCtx, patternData;
      const isPattern = currentMode === 'pattern' && selectedPatternImg;

      if (isPattern) {
        patternCanvas = document.createElement('canvas');
        patternCanvas.width = width;
        patternCanvas.height = height;
        patternCtx = patternCanvas.getContext('2d');
        const pattern = patternCtx.createPattern(selectedPatternImg, 'repeat');
        patternCtx.fillStyle = pattern;
        patternCtx.fillRect(0, 0, width, height);
        patternData = patternCtx.getImageData(0, 0, width, height).data;
      } else {
        // Parse hex color to RGBA
        let hex = currentMode === 'eraser' ? '#FFFFFF' : selectedColor;
        let c = parseInt(hex.replace('#', ''), 16);
        var fillR = (c >> 16) & 255;
        var fillG = (c >> 8) & 255;
        var fillB = c & 255;
      }

      // Check if clicked pixel already matches fill color
      if (!isPattern && startR === fillR && startG === fillG && startB === fillB) return;

      // Pixel Match Helper with Tolerance for anti-aliasing
      const matchTolerance = 45;
      function colorMatch(pos) {
        const r = data[pos];
        const g = data[pos + 1];
        const b = data[pos + 2];
        const a = data[pos + 3];

        if (a < 200) return false; // treat transparent as boundary
        
        const diffR = Math.abs(r - startR);
        const diffG = Math.abs(g - startG);
        const diffB = Math.abs(b - startB);

        return (diffR + diffG + diffB) < matchTolerance;
      }

      // Queue-based BFS Flood Fill Algorithm
      const queue = [startX, startY];
      const visited = new Uint8Array(width * height);

      while (queue.length > 0) {
        const y = queue.pop();
        const x = queue.pop();
        const pos = (y * width + x) * 4;

        if (visited[y * width + x]) continue;
        visited[y * width + x] = 1;

        if (colorMatch(pos)) {
          if (isPattern) {
            data[pos] = patternData[pos];
            data[pos + 1] = patternData[pos + 1];
            data[pos + 2] = patternData[pos + 2];
            data[pos + 3] = 255;
          } else {
            data[pos] = fillR;
            data[pos + 1] = fillG;
            data[pos + 2] = fillB;
            data[pos + 3] = 255;
          }

          // Push 4-directional neighbors
          if (x > 0) queue.push(x - 1, y);
          if (x < width - 1) queue.push(x + 1, y);
          if (y > 0) queue.push(x, y - 1);
          if (y < height - 1) queue.push(x, y + 1);
        }
      }

      // Apply updated pixels to canvas
      ctx.putImageData(imgData, 0, 0);

      // Re-draw crisp line-art black strokes on top layer so outlines stay clean
      TEMPLATES[currentTemplateIndex].draw(ctx, width, height);

      saveState();
      playSound('pop');
    }

    // --- Canvas Touch / Click Listener ---
    function handleCanvasTap(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((clientX - rect.left) * scaleX);
      const y = Math.floor((clientY - rect.top) * scaleY);

      floodFill(x, y);
    }

    // Event Listeners for Tap & Click
    canvas.addEventListener('click', handleCanvasTap);
    canvas.addEventListener('touchstart', handleCanvasTap, { passive: false });

    // --- UI Renderers ---

    // Render Side Template Thumbnails
    function renderTemplates() {
      templatesListEl.innerHTML = '';
      TEMPLATES.forEach((tmpl, idx) => {
        const btn = document.createElement('button');
        btn.className = `btn-pop p-3 rounded-2xl flex flex-col items-center justify-center border-4 ${
          idx === currentTemplateIndex ? 'border-purple-500 bg-purple-100 shadow-bouncy-sm' : 'border-white bg-white/60'
        }`;
        btn.innerHTML = `
          <i class="fa-solid ${tmpl.icon} text-2xl lg:text-3xl text-purple-600 mb-1"></i>
          <span class="text-xs font-bold text-purple-800 hidden lg:inline">${tmpl.name}</span>
        `;
        btn.addEventListener('click', () => {
          playSound('select');
          loadTemplate(idx);
        });
        templatesListEl.appendChild(btn);
      });
    }

    function updateTemplateUI() {
      Array.from(templatesListEl.children).forEach((child, idx) => {
        if (idx === currentTemplateIndex) {
          child.className = 'btn-pop p-3 rounded-2xl flex flex-col items-center justify-center border-4 border-purple-500 bg-purple-100 shadow-bouncy-sm';
        } else {
          child.className = 'btn-pop p-3 rounded-2xl flex flex-col items-center justify-center border-4 border-white bg-white/60';
        }
      });
    }

    // Render Bottom Toolbar Swatches (Swapping between Solid Colors & Patterns)
    function renderSwatches() {
      swatchesContainer.innerHTML = '';

      if (currentMode === 'solid') {
        trayTitleEl.innerText = 'Pick a Solid Color:';
        activeToolIndicator.innerText = 'Solid Fill';
        activeToolIndicator.className = 'px-3 py-0.5 rounded-full text-xs font-bold bg-purple-200 text-purple-800';
        uploadPatternLabel.classList.add('hidden');

        SOLID_COLORS.forEach(c => {
          const swatch = document.createElement('button');
          swatch.className = `btn-pop min-w-[50px] w-12 h-12 rounded-2xl border-4 border-white shadow-bouncy-sm flex items-center justify-center ${
            selectedColor === c.hex ? 'tool-selected' : ''
          }`;
          swatch.style.backgroundColor = c.hex;
          swatch.title = c.name;

          swatch.addEventListener('click', () => {
            playSound('select');
            selectedColor = c.hex;
            renderSwatches();
          });
          swatchesContainer.appendChild(swatch);
        });
      } else if (currentMode === 'pattern') {
        trayTitleEl.innerText = 'Choose Pattern Texture:';
        activeToolIndicator.innerText = 'Pattern Fill';
        activeToolIndicator.className = 'px-3 py-0.5 rounded-full text-xs font-bold bg-pink-200 text-pink-800';
        uploadPatternLabel.classList.remove('hidden');

        PATTERNS.forEach((p, idx) => {
          const swatch = document.createElement('button');
          const isSelected = selectedPatternImg && selectedPatternImg.src === p.src;
          swatch.className = `btn-pop min-w-[54px] w-14 h-14 rounded-2xl border-4 border-white shadow-bouncy-sm overflow-hidden bg-cover bg-center flex-shrink-0 ${
            isSelected ? 'tool-selected' : ''
          }`;
          swatch.style.backgroundImage = `url(${p.src})`;
          swatch.title = p.name;

          swatch.addEventListener('click', async () => {
            playSound('select');
            loader.classList.remove('hidden');
            selectedPatternImg = await preloadPattern(p.src);
            loader.classList.add('hidden');
            renderSwatches();
          });
          swatchesContainer.appendChild(swatch);
        });
      } else if (currentMode === 'eraser') {
        trayTitleEl.innerText = 'Eraser Mode Active:';
        activeToolIndicator.innerText = 'Eraser';
        activeToolIndicator.className = 'px-3 py-0.5 rounded-full text-xs font-bold bg-blue-200 text-blue-800';
        uploadPatternLabel.classList.add('hidden');

        const tipMsg = document.createElement('div');
        tipMsg.className = 'text-sm text-blue-700 font-bold px-4 py-2 bg-blue-50 rounded-2xl border border-blue-200';
        tipMsg.innerHTML = '<i class="fa-solid fa-circle-info mr-2"></i>Tap any colored section on the canvas to erase it back to white!';
        swatchesContainer.appendChild(tipMsg);
      }
    }

    // Handle Custom Pattern File Upload
    customPatternInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        const customSrc = event.target.result;
        const newPattern = {
          id: 'custom-' + Date.now(),
          name: 'My Pattern ' + (PATTERNS.length + 1),
          src: customSrc
        };

        // Add to pattern array at start
        PATTERNS.unshift(newPattern);
        
        // Auto-select uploaded pattern
        loader.classList.remove('hidden');
        selectedPatternImg = await preloadPattern(customSrc);
        loader.classList.add('hidden');
        
        playSound('select');
        renderSwatches();
      };
      reader.readAsDataURL(file);
    });

    // Mode Toggle Buttons
    modeSolidBtn.addEventListener('click', () => {
      currentMode = 'solid';
      updateModeButtons();
      renderSwatches();
      playSound('select');
    });

    modePatternBtn.addEventListener('click', () => {
      currentMode = 'pattern';
      updateModeButtons();
      renderSwatches();
      playSound('select');
    });

    modeEraserBtn.addEventListener('click', () => {
      currentMode = 'eraser';
      updateModeButtons();
      renderSwatches();
      playSound('select');
    });

    function updateModeButtons() {
      [modeSolidBtn, modePatternBtn, modeEraserBtn].forEach(btn => {
        btn.className = 'btn-pop bg-pink-50 text-gray-700 hover:bg-pink-100 p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-gray-200 shadow-bouncy-sm';
      });

      if (currentMode === 'solid') {
        modeSolidBtn.className = 'btn-pop bg-purple-500 text-white p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-purple-600 shadow-bouncy-sm';
      } else if (currentMode === 'pattern') {
        modePatternBtn.className = 'btn-pop bg-pink-500 text-white p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-pink-600 shadow-bouncy-sm';
      } else if (currentMode === 'eraser') {
        modeEraserBtn.className = 'btn-pop bg-blue-500 text-white p-3 rounded-2xl flex items-center justify-center lg:justify-start space-x-2 border-2 border-blue-600 shadow-bouncy-sm';
      }
    }

    // Top Action Handlers
    undoBtn.addEventListener('click', undo);
    
    clearBtn.addEventListener('click', () => {
      playSound('pop');
      loadTemplate(currentTemplateIndex);
    });

    finishBtn.addEventListener('click', () => {
      playSound('fanfare');
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    });

    // Window Resize Handling
    window.addEventListener('resize', () => {
      initCanvas();
    });

    // App Initialization
    window.onload = () => {
      renderTemplates();
      updateModeButtons();
      renderSwatches();
      initCanvas();
    };
  </script>
</body>
</html>
